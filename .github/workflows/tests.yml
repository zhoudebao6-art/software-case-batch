name: Public source contracts
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      TEMP: D:\codex+\temp
      TMP: D:\codex+\temp
      TMPDIR: D:\codex+\temp
      PIP_CACHE_DIR: D:\codex+\cache\pip
      PYTHONPYCACHEPREFIX: D:\codex+\cache\python-pycache
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      NPM_CONFIG_CACHE: D:\codex+\cache\npm
      NODE_COMPILE_CACHE: D:\codex+\cache\node-compile-cache
      XDG_CACHE_HOME: D:\codex+\cache
      PLAYWRIGHT_BROWSERS_PATH: D:\codex+\cache\ms-playwright
    steps:
      - name: Prepare process temp directory
        run: New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install unit-test dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Create non-secret CI configuration
        run: |
          $TaskSettings = [ordered]@{
            output_root = 'F:\研发图表'
            python = (Get-Command python.exe).Source
            node = (Get-Command node.exe).Source
            playwright_module = 'not-used-by-unit-ci'
            ffmpeg = 'not-used-by-unit-ci'
            ffprobe = 'not-used-by-unit-ci'
          }
          $TaskSettings | ConvertTo-Json | Set-Content -LiteralPath '.\local.config.json' -Encoding utf8
      - name: Python public contracts including Windows Job lifetime
        run: |
          . '.\Enter-Environment.ps1'
          & $env:SCB_PRO_PYTHON -X utf8 -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Node recording contracts
        run: |
          . '.\Enter-Environment.ps1'
          & $env:SCB_PRO_NODE --test '.\tests\test_record.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
